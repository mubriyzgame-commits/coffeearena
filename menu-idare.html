<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menyu idarəsi</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:20px;background:#f5f5f5}
    h1{margin-bottom:20px}.item{background:white;padding:14px;margin:10px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold}
    .available{background:#d9f7df}.unavailable{background:#ffdede}.soon{background:#fff0bf}
    #info{margin:15px 0;padding:12px;background:white;border-radius:10px}
  </style>
</head>
<body>
  <h1>☕ Menyu idarəsi</h1>
  <div id="info">Yüklənir...</div>
  <div id="list"></div>

  <script>
    const fileUrl = './menu-status.json';
    const items = {
      'Tost':'available','Hot-dog':'available','Ət qutab':'available','Göy qutab':'available',
      'Maxara':'available','Kartof free':'available','Sossiska':'available','Nuggets free':'available',
      'Burger free':'available','Kurasan çiyələk':'available','Kurasan şokolad':'available'
    };

    const labels = {available:'Hazırda var', unavailable:'Yoxdur / bitib', soon:'Hazırda yoxdur'};

    async function load(){
      try{
        const r=await fetch(fileUrl+'?v='+Date.now());
        const data=await r.json();
        Object.assign(items,data);
      }catch(e){}
      render();
    }

    function render(){
      document.getElementById('info').textContent='Menyu statusu: '+Object.values(items).filter(x=>x==='available').length+' məhsul hazırdır.';
      document.getElementById('list').innerHTML=Object.keys(items).map(name=>{
        const s=items[name]||'available';
        return `<div class="item"><b>${name}</b><span class="${s}">${labels[s]||labels.available}</span><button onclick="nextStatus('${name.replaceAll("'","\\'")}')">Dəyiş</button></div>`;
      }).join('');
    }

    function nextStatus(name){
      const order=['available','unavailable','soon'];
      items[name]=order[(order.indexOf(items[name])+1)%order.length];
      render();
      alert('Bu dəyişiklik yalnız bu idarə səhifəsində görünür. Saytda hamıya tətbiq etmək üçün menu-status.json faylını GitHub-da yeniləmək lazımdır.');
    }
    load();
  </script>
</body>
</html>

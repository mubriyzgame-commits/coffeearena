<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Menyu idarəsi</title>
<style>body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;padding:16px;background:#f5f5f5}h1{text-align:center}.section{margin:24px 0}.section h2{background:#222;color:#fff;padding:12px;border-radius:10px}.item{background:#fff;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.buttons{display:flex;gap:6px}button{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.yes{background:#d9f7df}.no{background:#ffdede}.active{outline:3px solid #333}@media(max-width:600px){.item{flex-direction:column;align-items:stretch}.buttons button{flex:1}}</style>
</head><body>
<h1>☕ Menyu idarəsi</h1><p>Hər məhsul üçün yalnız <b>VAR</b> və ya <b>YOXDUR</b> seç.</p><div id="app"></div>
<script>
const groups={
'🍔 Yeməklər':['Tost','Hot-dog','Ət qutab','Göy qutab','Maxara','Kartof free','Sossiska','Nuggets free','Burger free','Kurasan çiyələk','Kurasan şokolad'],
'🥤 İçəcəklər':[],
'☕ Kofelər':[]
};
const state={}; Object.values(groups).flat().forEach(x=>state[x]=true);
function render(){document.getElementById('app').innerHTML=Object.entries(groups).map(([group,names])=>`<section class="section"><h2>${group}</h2>${names.length?names.map(name=>`<div class="item"><b>${name}</b><div class="buttons"><button class="yes ${state[name]?'active':''}" onclick="setState('${name}',true)">✅ VAR</button><button class="no ${!state[name]?'active':''}" onclick="setState('${name}',false)">❌ YOXDUR</button></div></div>`).join(''):'<p>Bu bölmədə məhsul yoxdur.</p>'}</section>`).join('')}
function setState(name,value){state[name]=value;render()}
render();
</script></body></html>

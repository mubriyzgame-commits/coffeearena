<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Menyu idarəsi</title>
<style>body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;padding:16px;background:#f5f5f5}h1{text-align:center}.login{background:#fff;padding:14px;border-radius:10px;margin:18px 0;display:flex;gap:8px;flex-wrap:wrap}.login input{flex:1;min-width:220px;padding:10px;border:1px solid #ccc;border-radius:8px}.section{margin:24px 0}.section h2{background:#222;color:#fff;padding:12px;border-radius:10px}.item{background:#fff;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.buttons{display:flex;gap:6px}button{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.yes{background:#d9f7df}.no{background:#ffdede}.active{outline:3px solid #333}.status{font-size:14px;font-weight:bold}@media(max-width:600px){.item{flex-direction:column;align-items:stretch}.buttons button{flex:1}}</style>
</head><body>
 <style>
.menu-kechid-btn {
    display: inline-block;
    padding: 12px 22px;
    margin: 10px;
    background: #111;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.menu-kechid-btn:hover {
    background: #fff;
    color: #111;
    transform: translateY(-2px);
}
</style>
 <a href="gizli-panel.html" class="menu-kechid-btn">
    ← Gizli panel
</a>
<h1>☕ Menyu idarəsi</h1>
<p>Buradan məhsulun <b>VAR</b> və ya <b>YOXDUR</b> vəziyyətini dəyiş. Dəyişiklik bütün cihazlarda tətbiq olunur.</p>
<div class="login"><input id="adminKey" type="password" placeholder="Admin açarı"><button onclick="connect()">🔐 Qoşul</button><span id="loginStatus" class="status"></span></div>
<div id="app"></div>
<script>
const API='https://solitary-disk-196f.mubriyzgame.workers.dev';
const groups={
'🍔 Yeməklər':['Tost','Hot-dog','Ət qutab','Göy qutab','Maxara','Kartof free','Sossiska','Nuggets free','Burger free','Kurasan çiyələk','Kurasan şokolad'],
'🥤 İçəcəklər':['Mojito','Mojito Siroplu','Milk shake vanil','Milk shake çiyələk','Milk shake banan','Milk shake Oreo','İce capuccino','İce latte','Blue vanilla latte','İce espresso','İce nescafe','Marojna Kokteyl','Limonad 2L','Kola 0.3 ml','Fanta 0.3 ml','Sprite 0.3 ml','Qazlı su 1l','Qazsız su 1l','Redbul 250 ml','Soyuq çay','Mojito ALC','Efes draft','Karona','Jagermaster kokteyl','Jameson kokteyl'],
'☕ Kofelər':['Espresso','Americano','Capuccino','Latte','Mocha','İsti şokolad','Nescafe','Raff Coffee','Coffe Arena (Nədi Hodu)','Çay','Bitki çayı','Samovar çayı','Çay dəzgahı','Snikers','Pletka şokolad','Çiyələk mürəbbə','Qoz mürəbbə','Gilas mürəbbə','Kivi mürəbbə']
};
const categoryForGroup={'🍔 Yeməklər':'yemek','🥤 İçəcəklər':'icecek','☕ Kofelər':'coffee'};
let data={yemek:{},icecek:{},coffee:{}};
let adminKey=sessionStorage.getItem('coffee_admin_key')||'';
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function load(){
 try{const r=await fetch(API+'/api/menu'); if(!r.ok)throw new Error('API'); data=await r.json(); render();}
 catch(e){document.getElementById('loginStatus').textContent='❌ API-yə qoşulmaq olmadı'; render();}
}
async function connect(){
 const key=document.getElementById('adminKey').value.trim();
 if(!key){document.getElementById('loginStatus').textContent='Admin açarını yaz';return;}
 adminKey=key; sessionStorage.setItem('coffee_admin_key',key);
 try{const r=await fetch(API+'/api/menu/yemek/__test__',{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({available:true})});
 if(r.status===401)throw new Error('bad');
 document.getElementById('loginStatus').textContent='✅ Admin qoşuldu'; await load();
 }catch(e){sessionStorage.removeItem('coffee_admin_key');adminKey='';document.getElementById('loginStatus').textContent='❌ Admin açarı səhvdir';}
}
async function save(category,name,value){
 if(!adminKey){alert('Əvvəlcə admin açarı ilə qoşul.');return;}
 try{const r=await fetch(API+'/api/menu/'+category+'/'+encodeURIComponent(name),{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':adminKey},body:JSON.stringify({available:value})});
 if(r.status===401){sessionStorage.removeItem('coffee_admin_key');adminKey='';alert('Admin açarı düzgün deyil. Yenidən qoşul.');return;}
 if(!r.ok)throw new Error('save');
 if(!data[category])data[category]={}; data[category][name]={available:value}; render();
 }catch(e){alert('Məhsulun vəziyyəti yadda saxlanmadı.');}
}
function render(){document.getElementById('app').innerHTML=Object.entries(groups).map(([group,names])=>{const cat=categoryForGroup[group];return `<section class="section"><h2>${group}</h2>${names.map(name=>{const available=data[cat]?.[name]?.available!==false;return `<div class="item"><b>${name}</b><div class="buttons"><button class="yes ${available?'active':''}" onclick="save('${cat}','${esc(name)}',true)">✅ VAR</button><button class="no ${!available?'active':''}" onclick="save('${cat}','${esc(name)}',false)">❌ YOXDUR</button></div></div>`}).join('')}</section>`}).join('')}
if(adminKey){document.getElementById('loginStatus').textContent='🔐 Admin açarı yadda saxlanıb';}
render();load();
</script></body></html>

<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gizli panel</title>
  <style>
    body{font-family:Arial,sans-serif;background:#3c8527;margin:0;padding:20px;min-height:100vh}
    .panel{background:white;padding:25px;border-radius:15px;max-width:600px;margin:auto;box-shadow:0 8px 25px rgba(0,0,0,.25)}
    h1{margin-top:0}.section{margin-top:22px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd}.count{font-weight:bold}
  </style>
</head>
<body>
  <div class="panel">
    <h1>Sayt ziyarətləri</h1>
    <div class="row"><span>Ümumi</span><span id="total" class="count">...</span></div>

    <div class="section"><h2>📱 Cihaz növü</h2>
      <div class="row"><span>Telefon</span><span id="phone" class="count">...</span></div>
      <div class="row"><span>Planşet</span><span id="tablet" class="count">...</span></div>
      <div class="row"><span>PC</span><span id="pc" class="count">...</span></div>
    </div>

    <div class="section"><h2>⚙️ Əməliyyat sistemi</h2>
      <div class="row"><span>Android</span><span id="android" class="count">...</span></div>
      <div class="row"><span>iOS / iPadOS</span><span id="ios" class="count">...</span></div>
      <div class="row"><span>Windows</span><span id="windows" class="count">...</span></div>
      <div class="row"><span>macOS</span><span id="macos" class="count">...</span></div>
      <div class="row"><span>Linux</span><span id="linux" class="count">...</span></div>
    </div>

    <div class="section"><h2>📱 Marka / cihaz</h2>
      <div id="brands"></div>
    </div>
  </div>

  <script>
    const NS = 'coffeearena';

    async function get(key) {
      try {
        const r = await fetch(`https://counterapi.com/api/${NS}/view/${key}?readOnly=true`);
        const d = await r.json();
        return d.value ?? 0;
      } catch { return 0; }
    }

    async function load() {
      const keys = {
        total:'index', phone:'type_phone', tablet:'type_tablet', pc:'type_pc',
        android:'os_android', ios:'os_ios', windows:'os_windows', macos:'os_macos', linux:'os_linux'
      };

      await Promise.all(Object.entries(keys).map(async ([id,key]) => {
        document.getElementById(id).textContent = await get(key);
      }));

      const brands = [
        ['iPhone','brand_iphone'],['iPad','brand_ipad'],['Samsung','brand_samsung'],
        ['Xiaomi / Redmi / POCO','brand_xiaomi'],['Huawei / Honor','brand_huawei'],
        ['OPPO','brand_oppo'],['vivo','brand_vivo'],['OnePlus','brand_oneplus'],
        ['Google Pixel','brand_google'],['Motorola','brand_motorola'],['Sony','brand_sony'],
        ['Nokia','brand_nokia'],['Apple PC','brand_apple_pc'],['Digər PC','brand_pc'],['Digər','brand_other']
      ];

      const box = document.getElementById('brands');
      const values = await Promise.all(brands.map(async ([name,key]) => [name, await get(key)]));
      box.innerHTML = values.filter(([,value]) => value > 0).map(([name,value]) =>
        `<div class="row"><span>${name}</span><span class="count">${value}</span></div>`
      ).join('') || '<div>Hələ məlumat yoxdur.</div>';
    }

    load();
  </script>
</body>
</html>

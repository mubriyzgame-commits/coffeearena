<!doctype html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gizli panel</title><style>body{font-family:Arial;background:#3c8527;margin:0;padding:20px}.panel{background:#fff;padding:25px;border-radius:15px;max-width:600px;margin:auto}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd}.count{font-weight:bold}.status{font-size:13px;color:#666;margin-top:12px}</style></head><body><div class="panel"><h1>Sayt ziyarətləri</h1><div id="stats">Yüklənir...</div><div id="status" class="status"></div></div><script>
const API='https://api.counterapi.dev/v1/coffeearena/';
const names=[['Ümumi','index'],['🍔 Yeməklər','menu_yemek'],['🥤 İçəcəklər','menu_icecek'],['☕ Kofelər','menu_coffee'],['📱 Telefon','type_phone'],['📱 Planşet','type_tablet'],['💻 PC','type_pc'],['Android','os_android'],['iOS / iPadOS','os_ios'],['Windows','os_windows'],['macOS','os_macos'],['Linux','os_linux']];
async function get(name){const r=await fetch(API+encodeURIComponent(name));if(!r.ok)throw new Error(r.status);const d=await r.json();return d.count??d.data?.count??d.value??d.data?.value}
async function load(){let html='';let ok=0;for(const [label,key] of names){try{const v=await get(key);html+=`<div class="row"><span>${label}</span><span class="count">${v??'—'}</span></div>`;if(v!=null)ok++}catch{html+=`<div class="row"><span>${label}</span><span class="count">—</span></div>`}}document.getElementById('stats').innerHTML=html;document.getElementById('status').textContent=`${ok}/${names.length} sayğac oxundu • ${new Date().toLocaleTimeString('az-AZ')}`}
load();setInterval(load,5000);
</script></body></html>

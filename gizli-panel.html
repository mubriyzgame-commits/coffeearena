<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gizli panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#3c8527;margin:0;padding:20px}
header{margin-bottom:20px}
header a{text-decoration:none;color:black;font-size:20px}
.panel{background:#fff;padding:25px;border-radius:15px;max-width:650px;margin:auto}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ddd}
.count{font-weight:bold;font-size:18px}
.status{font-size:13px;color:#666;margin-top:12px}
h1{margin-bottom:10px}
h2{margin:20px 0 8px}
  .menu-kechid-btn {
    display: inline-block;
    padding: 12px 22px;
    margin: 10px;
    background: #111;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.menu-kechid-btn:hover {
    background: #fff;
    color: #111;
    transform: translateY(-2px);
}
</style></head>
<body>
<header>
<a href="menu-idare-v2.html" class="menu-kechid-btn">
    ⚙️ Menyu idarə
</a>
</header>
<div class="panel"><h1>Sayt ziyarətləri</h1><div id="stats">Yüklənir...</div><div id="status" class="status"></div></div>
<script>
const BASE='https://counterapi.com/api/coffeearena/view/';
const groups=[
['Əsas statistika',[['Ümumi','index'],['🍔 Yeməklər','menu_yemek'],['🥤 İçəcəklər','menu_icecek'],['☕ Kofelər','menu_coffee'],['📱 Telefon','type_phone'],['📱 Planşet','type_tablet'],['💻 PC','type_pc'],['Android','os_android'],['iOS / iPadOS','os_ios'],['Windows','os_windows'],['macOS','os_macos'],['Linux','os_linux']]],
['Telefon / cihaz markaları',[['iPhone','brand_iphone'],['iPad','brand_ipad'],['Samsung','brand_samsung'],['Xiaomi / Redmi / Poco','brand_xiaomi'],['Huawei / Honor','brand_huawei'],['OPPO','brand_oppo'],['vivo','brand_vivo'],['OnePlus','brand_oneplus'],['Google Pixel','brand_google'],['Motorola','brand_motorola'],['Sony','brand_sony'],['Nokia','brand_nokia'],['PC','brand_pc'],['Apple PC','brand_apple_pc'],['Digər','brand_other']]]
];
async function get(key){try{const r=await fetch(BASE+encodeURIComponent(key)+'?readOnly=true');if(!r.ok)return 0;const d=await r.json();return d.value??0}catch{return 0}}
async function load(){
  const all=groups.flatMap(([group,items])=>items.map(([label,key])=>({group,label,key})));
  const results=await Promise.all(all.map(async x=>({...x,value:await get(x.key)})));
  let html='';
  for(const [group] of groups){html+=`<h2>${group}</h2>`;results.filter(x=>x.group===group).forEach(x=>{html+=`<div class="row"><span>${x.label}</span><span class="count">${x.value}</span></div>`})}
  document.getElementById('stats').innerHTML=html;
  document.getElementById('status').textContent=`${results.length} sayğac oxundu • ${new Date().toLocaleTimeString('az-AZ')}`;
}
load();setInterval(load,5000);
</script></body></html>

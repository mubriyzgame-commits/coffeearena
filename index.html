<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Arena</title>
    <link rel="stylesheet" href="./əsas səhifə.css" />
  </head>

  <body>
    <header>
      <h1 class="text">Coffee Arenaya xoş gəlmisiniz!</h1>
      <h2 class="text">Seçiminizi edin</h2>
    </header>

    <div class="carts">
      <a href="./yemək menusu.html">
        <div class="cart">
          <h1>Yeməklər</h1>
        </div>
      </a>

      <a href="./içəcək menusu.html">
        <div class="cart">
          <h1>İçəcəklər</h1>
        </div>
      </a>

      <a href="./coffee menusu.html">
        <div class="cart">
          <h1>Kofelər</h1>
        </div>
      </a>
    </div>

    <script>
      function hit(key) {
        fetch('https://counterapi.com/api/coffeearena/view/' + encodeURIComponent(key)).catch(() => {});
      }

      // Ümumi səhifə sayğacı
      hit('index');

      const ua = navigator.userAgent.toLowerCase();
      const isTablet = /ipad|tablet|android(?!.*mobile)/i.test(ua);
      const isPhone = /iphone|ipod|android.*mobile/i.test(ua);
      const isPC = !isTablet && !isPhone;

      // Cihaz tipi
      hit(isPhone ? 'type_phone' : isTablet ? 'type_tablet' : 'type_pc');

      // Əməliyyat sistemi
      if (/android/i.test(ua)) hit('os_android');
      else if (/iphone|ipad|ipod/i.test(ua)) hit('os_ios');
      else if (/windows/i.test(ua)) hit('os_windows');
      else if (/mac os/i.test(ua)) hit('os_macos');
      else if (/linux/i.test(ua)) hit('os_linux');
      else hit('os_other');

      // Brend
      if (/iphone/i.test(ua)) hit('brand_iphone');
      else if (/ipad/i.test(ua)) hit('brand_ipad');
      else if (/samsung/i.test(ua)) hit('brand_samsung');
      else if (/xiaomi|redmi|poco/i.test(ua)) hit('brand_xiaomi');
      else if (/huawei|honor/i.test(ua)) hit('brand_huawei');
      else if (/oppo/i.test(ua)) hit('brand_oppo');
      else if (/vivo/i.test(ua)) hit('brand_vivo');
      else if (/oneplus/i.test(ua)) hit('brand_oneplus');
      else if (/pixel/i.test(ua)) hit('brand_google');
      else if (/motorola/i.test(ua)) hit('brand_motorola');
      else if (/sony/i.test(ua)) hit('brand_sony');
      else if (/nokia/i.test(ua)) hit('brand_nokia');
      else if (isPC) hit(/mac os/i.test(ua) ? 'brand_apple_pc' : 'brand_pc');
      else hit('brand_other');
    </script>
  </body>
</html>

<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Arena</title>
    <link rel="stylesheet" href="./əsas səhifə.css" />
  </head>
  <body>
    <header>
      <h1 class="text">Coffee Arenaya xoş gəlmisiniz!</h1>
      <h2 class="text">Seçiminizi edin</h2>
    </header>
    <div class="carts">
      <a href="./yemək menusu.html"><div class="cart"><h1>Yeməklər</h1></div></a>
      <a href="./icecek.html"><div class="cart"><h1>İçəcəklər</h1></div></a>
      <a href="./coffee menusu.html"><div class="cart"><h1>Kofelər</h1></div></a>
    </div>
    <script>
      // Grok-style counter: read current value, then increment it by 1.
      // Session storage prevents a back-navigation/reload from counting again in the same session.
      const API = 'https://countapi.mileshilliard.com/api/v1';
      async function plusOne(key) {
        const k = 'counted_' + key;
        if (sessionStorage.getItem(k)) return;
        try {
          const r = await fetch(API + '/hit/coffeearena_' + encodeURIComponent(key));
          if (r.ok) sessionStorage.setItem(k, '1');
        } catch (_) {}
      }
      plusOne('index');
      const ua = navigator.userAgent.toLowerCase();
      const isTablet = /ipad|tablet|android(?!.*mobile)/i.test(ua);
      const isPhone = /iphone|ipod|android.*mobile/i.test(ua);
      const isPC = !isTablet && !isPhone;
      plusOne(isPhone ? 'type_phone' : isTablet ? 'type_tablet' : 'type_pc');
      if (/android/i.test(ua)) plusOne('os_android');
      else if (/iphone|ipad|ipod/i.test(ua)) plusOne('os_ios');
      else if (/windows/i.test(ua)) plusOne('os_windows');
      else if (/mac os/i.test(ua)) plusOne('os_macos');
      else if (/linux/i.test(ua)) plusOne('os_linux');
      else plusOne('os_other');
      if (/iphone/i.test(ua)) plusOne('brand_iphone');
      else if (/ipad/i.test(ua)) plusOne('brand_ipad');
      else if (/samsung/i.test(ua)) plusOne('brand_samsung');
      else if (/xiaomi|redmi|poco/i.test(ua)) plusOne('brand_xiaomi');
      else if (/huawei|honor/i.test(ua)) plusOne('brand_huawei');
      else if (/oppo/i.test(ua)) plusOne('brand_oppo');
      else if (/vivo/i.test(ua)) plusOne('brand_vivo');
      else if (/oneplus/i.test(ua)) plusOne('brand_oneplus');
      else if (/pixel/i.test(ua)) plusOne('brand_google');
      else if (/motorola/i.test(ua)) plusOne('brand_motorola');
      else if (/sony/i.test(ua)) plusOne('brand_sony');
      else if (/nokia/i.test(ua)) plusOne('brand_nokia');
      else if (isPC) plusOne(/mac os/i.test(ua) ? 'brand_apple_pc' : 'brand_pc');
      else plusOne('brand_other');
    </script>
  </body>
</html>
